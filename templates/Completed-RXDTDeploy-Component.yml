variables:
  StageCheckVariablesName: RX-CheckVariables
  StagePreparedServerName: RX-PreparedServer
  StageBuildPackageName: RX-BuildPackage
  StageDeployDTPackageName: RX-DeployDTPackage

include:
  - component: $CI_SERVER_FQDN/ci-cd-components/RX-CheckVariables-Component/RX-CheckVariables-Component@main
    inputs:
      stage: $StageCheckVariablesName
  - component: $CI_SERVER_FQDN/ci-cd-components/RX-PreparedServer-Component/RX-PreparedServer-Component@main
    inputs:
      stage: $StagePreparedServerName
  - component: $CI_SERVER_FQDN/ci-cd-components/RX-BuildPackage-Component/RX-BuildPackage-Component@main
    inputs:
      stage: $StageBuildPackageName
  - component: $CI_SERVER_FQDN/ci-cd-components/RX-DeployDTPackage-Component/RX-DeployDTPackage-Component@main
    inputs:
      stage: $StageDeployDTPackageName